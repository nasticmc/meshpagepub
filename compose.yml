services:
  meshpagepub:
    build:
      context: .
    image: meshpagepub:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      MESHPAGEPUB_DATA_DIR: /var/lib/meshpagepub
    volumes:
      - meshpagepub-state:/var/lib/meshpagepub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  meshpagepub-state:
